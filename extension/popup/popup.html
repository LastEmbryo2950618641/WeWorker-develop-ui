<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      font-size: 13px;
      color: #111827;
      background: #fff;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ───────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px 10px;
      border-bottom: 1px solid #f0f0f0;
    }
    .header-logo {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    .header-title {
      font-size: 13px;
      font-weight: 600;
      color: #111;
      letter-spacing: -0.01em;
    }
    .header-badge {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 99px;
    }
    .header-badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .badge-active  { background: #f0fdf4; color: #15803d; }
    .badge-active .dot { background: #22c55e; }
    .badge-none    { background: #f9fafb; color: #6b7280; }
    .badge-none .dot { background: #d1d5db; }

    /* ── Main ─────────────────────────────────────────────── */
    .main { padding: 14px; }

    /* ── Loading ──────────────────────────────────────────── */
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 32px 0;
      color: #9ca3af;
      font-size: 12px;
    }
    .spinner {
      width: 14px; height: 14px;
      border: 2px solid #e5e7eb;
      border-top-color: #6b7280;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Active State ─────────────────────────────────────── */
    .section-label {
      font-size: 11px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 10px;
    }

    .tool-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-height: 280px;
      overflow-y: auto;
    }
    .tool-list::-webkit-scrollbar { width: 4px; }
    .tool-list::-webkit-scrollbar-track { background: transparent; }
    .tool-list::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 2px; }

    .tool-item {
      padding: 8px 10px;
      border-radius: 6px;
      background: #f9fafb;
      border: 1px solid #f3f4f6;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tool-item:hover {
      background: #f0f9ff;
      border-color: #bae6fd;
      transform: translateY(-1px);
      box-shadow: none;
    }
    .tool-name {
      font-family: "SF Mono", "JetBrains Mono", "Fira Code", Menlo, monospace;
      font-size: 11.5px;
      font-weight: 600;
      color: #339CFF;
      margin-bottom: 2px;
    }
    .tool-desc {
      font-size: 11.5px;
      color: #4b5563;
      line-height: 1.4;
    }

    /* ── None State ───────────────────────────────────────── */
    .btn-row {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }
    .btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.15s, opacity 0.15s;
    }
    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
      border: 1px solid #e5e7eb;
    }
    .btn-secondary:hover { background: #e5e7eb; }

    /* ── None State ───────────────────────────────────────── */
    .none-body {
      text-align: center;
      padding: 16px 0 8px;
    }
    .none-icon {
      font-size: 28px;
      margin-bottom: 10px;
    }
    .none-title {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    .none-desc {
      font-size: 12px;
      color: #6b7280;
      line-height: 1.5;
      margin-bottom: 14px;
    }

    /* ── Error State ──────────────────────────────────────── */
    .error-body {
      text-align: center;
      padding: 20px 0;
      color: #6b7280;
      font-size: 12px;
    }

    /* ── Footer ───────────────────────────────────────────── */
    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      border-top: 1px solid #f0f0f0;
      background: #fafafa;
    }
    .ws-status {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      color: #6b7280;
    }
    .ws-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .ws-dot-on  { background: #22c55e; }
    .ws-dot-off { background: #d1d5db; }
    .footer-links {
      display: flex;
      gap: 10px;
    }
    .link {
      font-size: 11px;
      color: #9ca3af;
      cursor: pointer;
      text-decoration: none;
      transition: color 0.12s;
    }
    .link:hover { color: #374151; }
    .link-muted { color: #d1d5db; cursor: default; pointer-events: none; }

    /* ── Tool Test Modal ──────────────────────────────────── */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    .modal {
      background: white;
      border-radius: 8px;
      width: 320px;
      max-height: 400px;
      overflow-y: auto;
      box-shadow: none;
    }
    .modal-header {
      padding: 12px 14px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      gap: 10px;
      align-items: flex-start;
    }
    .modal-heading {
      flex: 1;
      min-width: 0;
    }
    .modal-title {
      font-size: 13px;
      font-weight: 600;
      color: #111827;
      font-family: "SF Mono", monospace;
    }
    .modal-subtitle {
      margin-top: 4px;
      font-size: 11px;
      color: #6b7280;
      line-height: 1.5;
    }
    .modal-close {
      flex: none;
      width: 24px;
      height: 24px;
      border: none;
      border-radius: 4px;
      background: transparent;
      color: #6b7280;
      font-size: 18px;
      line-height: 1;
      cursor: pointer;
    }
    .modal-close:hover {
      background: #f3f4f6;
      color: #111827;
    }
    .modal-body {
      padding: 14px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 4px;
    }
    .form-hint {
      font-size: 10px;
      color: #6b7280;
      margin-top: 2px;
    }
    .form-meta {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }
    .form-chip {
      display: inline-flex;
      align-items: center;
      padding: 2px 6px;
      border-radius: 999px;
      font-size: 10px;
      color: #4b5563;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
    }
    .form-input {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      font-size: 12px;
      font-family: inherit;
    }
    .form-input.form-textarea {
      min-height: 92px;
      resize: vertical;
      font-family: "SF Mono", Monaco, Consolas, monospace;
      line-height: 1.5;
    }
    .form-input:focus {
      outline: none;
      border-color: #339CFF;
    }
    .modal-footer {
      padding: 10px 14px;
      border-top: 1px solid #f0f0f0;
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }
    .btn-modal {
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.15s;
    }
    .btn-primary {
      background: #339CFF;
      color: white;
    }
    .btn-primary:hover {
      background: #66B3FF;
    }
    .btn-primary:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    .btn-cancel {
      background: #f3f4f6;
      color: #374151;
    }
    .btn-cancel:hover {
      background: #e5e7eb;
    }
    .result-box {
      margin-top: 12px;
      padding: 10px;
      border-radius: 4px;
      font-size: 11px;
      font-family: "SF Mono", monospace;
      white-space: pre-wrap;
      word-break: break-word;
      max-height: 200px;
      overflow-y: auto;
    }
    .result-success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }
    .result-error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    /* ── Explore Section ─────────────────────────────────── */
    .explore-section {
      padding: 0 14px 14px;
    }
    .explore-divider {
      height: 1px;
      background: #f0f0f0;
      margin-bottom: 12px;
    }
    .explore-btn {
      width: 100%;
      background: #f0f9ff;
      color: #0369a1;
      border: 1px solid #bae6fd;
      font-size: 12px;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .explore-btn:hover { background: #e0f2fe; }
    .explore-btn-small {
      flex: 0;
      padding: 6px 12px;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
      border: 1px solid #e5e7eb;
      background: #f9fafb;
      color: #374151;
      font-weight: 500;
      transition: background 0.15s;
    }
    .explore-btn-small:hover { background: #f3f4f6; }
    .explore-btn-primary {
      background: #eff8ff;
      color: #339CFF;
      border-color: #b3ddff;
    }
    .explore-btn-primary:hover { background: #e6f4ff; }
    .explore-loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 0;
      color: #6b7280;
      font-size: 12px;
    }
    .explore-result-card {
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 12px;
    }
    .explore-result-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .explore-badge {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .explore-badge-api { background: #e6f4ff; color: #339CFF; }
    .explore-badge-ui { background: #fef3c7; color: #92400e; }
    .explore-badge-hybrid { background: #ede9fe; color: #6d28d9; }
    .explore-strategy {
      font-size: 11px;
      font-weight: 600;
      color: #374151;
    }
    .explore-reason {
      font-size: 11px;
      color: #6b7280;
      line-height: 1.5;
      margin-bottom: 8px;
    }
    .explore-stats {
      font-size: 11px;
      color: #4b5563;
      margin-bottom: 10px;
    }
    .explore-actions {
      display: flex;
      gap: 8px;
    }
    .explore-error-msg {
      font-size: 11px;
      color: #dc2626;
      margin-bottom: 8px;
    }
    .explore-section.explore-subtle .explore-btn {
      background: #f9fafb;
      color: #6b7280;
      border-color: #e5e7eb;
    }
    .explore-section.explore-subtle .explore-btn:hover {
      background: #f3f4f6;
      color: #374151;
    }
    .explore-api-list {
      margin-bottom: 10px;
      max-height: 160px;
      overflow-y: auto;
    }
    .explore-api-title {
      font-size: 10px;
      font-weight: 600;
      color: #6b7280;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      margin-bottom: 6px;
    }
    .explore-api-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 0;
      font-size: 10.5px;
      border-bottom: 1px solid #f3f4f6;
    }
    .explore-api-item:last-child { border-bottom: none; }
    .explore-api-method {
      font-family: "SF Mono", monospace;
      font-size: 9px;
      font-weight: 600;
      color: #6d28d9;
      background: #f5f3ff;
      padding: 1px 4px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .explore-api-url {
      font-family: "SF Mono", monospace;
      font-size: 10px;
      color: #374151;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .explore-api-status {
      font-size: 9px;
      color: #6b7280;
      flex-shrink: 0;
    }
    .explore-save-status {
      margin-top: 8px;
      font-size: 11px;
      padding: 6px 8px;
      border-radius: 4px;
      background: #f0fdf4;
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .explore-save-status.save-error {
      background: #fef2f2;
      color: #991b1b;
      border-color: #fecaca;
    }
    .explore-generate-result {
      margin-top: 8px;
      font-size: 11px;
      padding: 8px;
      border-radius: 4px;
      background: #f9fafb;
      border: 1px solid #e5e7eb;
      max-height: 200px;
      overflow-y: auto;
    }
    .explore-generate-result pre {
      font-family: "SF Mono", monospace;
      font-size: 10px;
      white-space: pre-wrap;
      word-break: break-all;
      margin: 0;
    }
    .explore-generate-header {
      font-size: 10px;
      font-weight: 600;
      color: #374151;
      margin-bottom: 6px;
    }
    .explore-generate-actions {
      margin-top: 6px;
      display: flex;
      gap: 6px;
    }

    /* Product UI refresh: keep popup aligned with sidepanel */
    :root {
      --surface-page: #f5f7fb;
      --surface-panel: rgba(255, 255, 255, 0.96);
      --surface-muted: #f8fafc;
      --surface-raised: #ffffff;
      --line-soft: #e6ebf2;
      --line-strong: #d8e0eb;
      --text-main: #172033;
      --text-subtle: #5d6b82;
      --text-muted: #8a97aa;
      --brand: #1f6feb;
      --brand-strong: #1557c0;
      --brand-soft: #eaf2ff;
      --success: #15803d;
      --success-soft: #ecfdf3;
      --warning: #b45309;
      --warning-soft: #fff7ed;
      --danger: #dc2626;
      --danger-soft: #fef2f2;
      --shadow-card: none;
      --shadow-float: none;
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
    }

    body {
      color: var(--text-main);
      background:
        radial-gradient(circle at 18% -12%, rgba(31, 111, 235, 0.16), transparent 36%),
        linear-gradient(180deg, #ffffff 0%, var(--surface-page) 45%, #eef3f9 100%);
      -webkit-font-smoothing: antialiased;
    }
    .header {
      padding: 13px 16px 11px;
      background: rgba(255, 255, 255, 0.86);
      border-bottom-color: var(--line-soft);
    }
    .header-logo {
      width: 22px;
      height: 22px;
      border-radius: 7px;
      box-shadow: none;
    }
    .header-title {
      color: var(--text-main);
      font-size: 14px;
      letter-spacing: -0.01em;
    }
    .header-badge {
      border: 1px solid transparent;
      font-size: 10.5px;
      font-weight: 650;
    }
    .badge-active { background: var(--success-soft); color: var(--success); border-color: #bbf7d0; }
    .badge-active .dot { background: #22c55e; }
    .badge-none { background: #eef2f7; color: var(--text-subtle); border-color: var(--line-soft); }
    .badge-none .dot { background: #94a3b8; }
    .main { padding: 16px; }
    .loading,
    .explore-loading {
      color: var(--text-subtle);
    }
    .spinner {
      border-color: #dbe4ef;
      border-top-color: var(--brand);
    }
    .section-label {
      color: var(--text-muted);
      font-size: 11px;
      letter-spacing: 0.04em;
    }
    .tool-list {
      gap: 8px;
      max-height: 310px;
    }
    .tool-item {
      padding: 11px 12px;
      border-radius: var(--radius-md);
      background: var(--surface-panel);
      border-color: var(--line-soft);
      box-shadow: none;
    }
    .tool-item:hover {
      background: #ffffff;
      border-color: #c7dcff;
      box-shadow: none;
      transform: translateY(-1px);
    }
    .tool-name {
      color: var(--brand);
      font-size: 12px;
      letter-spacing: -0.01em;
    }
    .tool-desc {
      color: var(--text-subtle);
      font-size: 12px;
    }
    .none-body {
      padding: 30px 18px;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-lg);
      background: var(--surface-panel);
      box-shadow: none;
    }
    .none-title {
      color: var(--text-main);
      font-size: 15px;
    }
    .none-desc {
      color: var(--text-subtle);
      font-size: 12.5px;
    }
    .btn,
    .explore-btn-small,
    .btn-modal {
      min-height: 30px;
      border-radius: var(--radius-sm);
      font-weight: 650;
      transition: transform 0.14s, box-shadow 0.14s, background 0.14s, border-color 0.14s;
    }
    .btn:hover,
    .explore-btn-small:hover,
    .btn-modal:hover {
      transform: translateY(-1px);
    }
    .btn-secondary,
    .explore-btn-small,
    .btn-cancel {
      background: #ffffff;
      color: var(--text-subtle);
      border-color: var(--line-strong);
    }
    .btn-secondary:hover,
    .explore-btn-small:hover,
    .btn-cancel:hover {
      color: var(--text-main);
      background: var(--surface-muted);
      border-color: #cbd5e1;
    }
    .explore-btn,
    .explore-btn-primary,
    .btn-primary {
      background: linear-gradient(135deg, var(--brand), #3b82f6);
      color: #ffffff;
      border: 1px solid rgba(21, 87, 192, 0.2);
      box-shadow: none;
    }
    .explore-btn:hover,
    .explore-btn-primary:hover,
    .btn-primary:hover {
      background: linear-gradient(135deg, var(--brand-strong), var(--brand));
      box-shadow: none;
    }
    .explore-section {
      padding: 0 16px 16px;
      background: transparent;
    }
    .explore-divider {
      background: var(--line-soft);
      margin-bottom: 14px;
    }
    .explore-result-card {
      background: var(--surface-panel);
      border-color: var(--line-soft);
      border-radius: var(--radius-lg);
      box-shadow: none;
      padding: 14px;
    }
    .explore-badge {
      border-radius: 999px;
      padding: 3px 8px;
      letter-spacing: 0.02em;
    }
    .explore-badge-api { background: var(--brand-soft); color: var(--brand); }
    .explore-badge-ui { background: var(--warning-soft); color: var(--warning); }
    .explore-badge-hybrid { background: #f5f3ff; color: #6d28d9; }
    .explore-strategy {
      color: var(--text-main);
      font-size: 12px;
    }
    .explore-reason {
      color: var(--text-subtle);
      font-size: 12px;
      line-height: 1.6;
    }
    .explore-stats {
      color: var(--text-muted);
    }
    .explore-actions {
      flex-wrap: wrap;
      gap: 8px;
    }
    .explore-api-list {
      padding: 10px;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-md);
      background: var(--surface-muted);
    }
    .explore-api-title {
      color: var(--text-muted);
      font-size: 11.5px;
      letter-spacing: 0.03em;
      margin-bottom: 8px;
    }
    .explore-api-item {
      align-items: flex-start;
      padding: 9px 0;
      border-bottom-color: var(--line-soft);
      font-size: 12px;
    }
    .explore-api-method {
      color: #6d28d9;
      background: #f5f3ff;
      border-radius: 999px;
      font-size: 10.5px;
      line-height: 1.2;
      padding: 3px 6px;
      margin-top: 1px;
    }
    .explore-api-url {
      color: var(--text-main);
      font-size: 12px;
      line-height: 1.45;
    }
    .explore-api-status {
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.45;
      margin-top: 1px;
    }
    .explore-save-status,
    .result-success {
      background: var(--success-soft);
      border-color: #bbf7d0;
      color: var(--success);
      border-radius: var(--radius-md);
    }
    .explore-save-status.save-error,
    .result-error {
      background: var(--danger-soft);
      border-color: #fecaca;
      color: var(--danger);
      border-radius: var(--radius-md);
    }
    .explore-generate-result,
    .result-box {
      background: var(--surface-muted);
      border-color: var(--line-soft);
      color: var(--text-main);
      border-radius: var(--radius-md);
    }
    .form-label {
      color: var(--text-main);
      font-size: 12px;
    }
    .form-hint {
      color: var(--text-muted);
      font-size: 11px;
      line-height: 1.45;
    }
    .form-chip {
      color: var(--text-subtle);
      background: var(--surface-muted);
      border-color: var(--line-soft);
    }
    .form-input {
      min-height: 36px;
      padding: 8px 10px;
      color: var(--text-main);
      background: #ffffff;
      border-color: var(--line-strong);
      border-radius: var(--radius-sm);
      font-size: 12.5px;
      font-family: inherit;
      transition: border-color 0.14s, box-shadow 0.14s, background 0.14s;
    }
    .form-input:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(31, 111, 235, 0.12);
    }
    .modal-overlay {
      background: rgba(15, 23, 42, 0.28);
    }
    .modal {
      width: min(420px, calc(100vw - 28px));
      max-height: 86vh;
      background: #ffffff;
      border: 1px solid var(--line-soft);
      border-radius: var(--radius-lg);
      box-shadow: none;
    }
    .modal-header,
    .modal-footer {
      border-color: var(--line-soft);
    }
    .modal-title {
      color: var(--brand);
      font-size: 13px;
    }
    .modal-subtitle { color: var(--text-subtle); }
    .modal-close {
      color: var(--text-muted);
      border-radius: var(--radius-sm);
    }
    .modal-close:hover {
      color: var(--text-main);
      background: var(--surface-muted);
    }
    .footer {
      background: rgba(255, 255, 255, 0.86);
      border-top-color: var(--line-soft);
    }
    .ws-status { color: var(--text-muted); }
    .ws-dot-on { background: #22c55e; }
    .ws-dot-off { background: #94a3b8; }
    .link { color: var(--text-muted); }
    .link:hover { color: var(--brand); }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <img class="header-logo" src="../icons/icon48.png" alt="WeWorker" />
    <span class="header-title">WeWorker Browser Adapter</span>
    <span class="header-badge" id="headerBadge">
      <span class="dot"></span>
      <span id="headerBadgeText"></span>
    </span>
  </div>

  <!-- Main content -->
  <div class="main" id="main">

    <!-- Loading -->
    <div id="stateLoading" class="loading">
      <div class="spinner"></div>
      <span>加载中…</span>
    </div>

    <!-- Active: tools ready -->
    <div id="stateActive" hidden>
      <div class="section-label" id="toolCountLabel"></div>
      <div class="tool-list" id="toolList"></div>
    </div>

    <!-- None: no adapter for this site -->
    <div id="stateNone" hidden>
      <div class="none-body">
        <div class="none-icon">🔍</div>
        <div class="none-title">此网站暂无适配器</div>
        <div class="none-desc">
          WeWorker 目前还不支持此网站。<br />
          你可以提交 Issue 或贡献一个新适配器。
        </div>
        <div class="btn-row" style="justify-content:center;gap:8px">
          <button class="btn btn-secondary" id="btnNewIssue" style="flex:0;padding:7px 14px">提交 Issue ↗</button>
          <button class="btn btn-secondary" id="btnContribute" style="flex:0;padding:7px 14px">贡献指南 ↗</button>
        </div>
      </div>
    </div>

    <!-- Error / unsupported page -->
    <div id="stateError" hidden>
      <div class="error-body" id="errorMsg">无法获取此页面的信息</div>
    </div>

  </div>

  <!-- Explore Section -->
  <div id="exploreSection" class="explore-section" hidden>
    <div class="explore-divider"></div>

    <!-- Idle: show explore button -->
    <div id="exploreIdle">
      <button class="btn explore-btn" id="btnExplore">
        <span>&#x1F50D;</span>
        探索此网站
      </button>
    </div>

    <!-- Loading -->
    <div id="exploreLoading" hidden>
      <div class="explore-loading">
        <div class="spinner"></div>
        <span id="exploreLoadingText">正在分析页面…</span>
      </div>
    </div>

    <!-- Analyze Results -->
    <div id="exploreResults" hidden>
      <div class="explore-result-card">
        <div class="explore-result-header">
          <span class="explore-badge" id="exploreBadge"></span>
          <span class="explore-strategy" id="exploreStrategy"></span>
        </div>
        <div class="explore-reason" id="exploreReason"></div>
        <div class="explore-stats" id="exploreStats"></div>
        <div class="explore-actions">
          <button class="explore-btn-small explore-btn-primary" id="btnExploreWorkflow">捕获页面接口 →</button>
          <button class="explore-btn-small" id="btnExploreReset">重新分析</button>
        </div>
      </div>
    </div>

    <!-- Workflow Results -->
    <div id="exploreWorkflowResults" hidden>
      <div class="explore-result-card">
        <div class="explore-result-header">
          <span class="explore-badge" id="exploreWfBadge"></span>
          <span class="explore-strategy" id="exploreWfStrategy"></span>
        </div>
        <div class="explore-reason" id="exploreWfReason"></div>
        <div class="explore-stats" id="exploreWfStats"></div>
        <div id="exploreWfApiList" class="explore-api-list" hidden></div>
        <div class="explore-actions">
          <button class="explore-btn-small explore-btn-primary" id="btnExploreSave">保存探索结果</button>
          <button class="explore-btn-small explore-btn-primary" id="btnExploreGenerate" hidden>生成网站工具</button>
          <button class="explore-btn-small" id="btnExploreWfReset">重新分析</button>
        </div>
        <div id="exploreSaveStatus" class="explore-save-status" hidden></div>
        <div id="exploreGenerateResult" class="explore-generate-result" hidden></div>
      </div>
    </div>

    <!-- Error -->
    <div id="exploreError" hidden>
      <div class="explore-error-msg" id="exploreErrorText"></div>
      <button class="explore-btn-small" id="btnExploreRetry">重试</button>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="ws-status">
      <div class="ws-dot" id="wsDot"></div>
      <span id="wsLabel">检查连接…</span>
    </div>
    <div class="footer-links">
      <span class="link" style="color:#d1d5db;cursor:default" id="extVersion"></span>
      <span class="link" id="linkGitHub">GitHub ↗</span>
      <span class="link" id="linkDocs">文档 ↗</span>
    </div>
  </div>

  <!-- Tool Test Modal -->
  <div id="toolModal" class="modal-overlay" hidden>
    <div class="modal">
      <div class="modal-header">
        <div class="modal-heading">
          <div class="modal-title" id="modalToolName"></div>
          <div class="modal-subtitle" id="modalToolDesc" hidden></div>
        </div>
        <button class="modal-close" id="btnModalClose" type="button" aria-label="关闭">×</button>
      </div>
      <div class="modal-body">
        <div id="modalForm"></div>
        <div id="modalResult" hidden></div>
      </div>
      <div class="modal-footer">
        <button class="btn-modal btn-cancel" id="btnModalCancel">取消</button>
        <button class="btn-modal btn-primary" id="btnModalExecute">执行</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
